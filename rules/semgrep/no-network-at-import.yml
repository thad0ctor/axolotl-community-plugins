rules:
  - id: axolotl-plugin-no-network-at-import
    languages: [python]
    severity: WARNING
    message: >
      Network access at module import time. A plugin's top-level code runs during
      axolotl config load; fetching at import is both a hazard and undeclared behaviour.
      Move it into a hook that runs during training, or declare it.
    patterns:
      - pattern-either:
          - pattern: requests.$M(...)
          - pattern: urllib.request.urlopen(...)
          - pattern: socket.socket(...)
          - pattern: httpx.$M(...)
      # Flag calls that run at import: module scope AND class-body scope (a class body
      # executes when the module is imported). Only calls inside a function/method are
      # deferred to call time, so those are excluded.
      - pattern-not-inside: |
          def $F(...):
              ...
